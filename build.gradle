plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = mod_version
group = 'com.chunkworks.serfdom'
base { archivesName = 'serfdom' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenLocal { content { includeGroup 'com.chunkworks.carried'; includeGroup 'com.nfx.rangedweapons' } }
    mavenCentral()
    // Farmer's Delight is published on Modrinth's maven, not Central.
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
// Village Deed 2.2.0, the village protocol and its claims: built in the sibling repo (its v2.2.0
// tag), not bundled. Optional at run time: without it nobody's village is bought.
def villageDeed = files('../minecraft-village-deed/build/libs/villagedeed-2.2.0.jar')
// Farmer's Delight 1.3.3 (sha1 55ea87de, the box's jar): its tomatoes and rice. Optional.
def farmersDelight = 'maven.modrinth:farmers-delight:wpkbWnVh'
// Thief 1.2.4: a capture is its HEAVY crime (D-0003); Village Deed requires it too.
def thief = 'maven.modrinth:thief:Zhr0tVOO'
// Village Law 1.1.0: a capture an officer saw is owed to the player's case (its api.Cases), and the
// case's settlement frees it. Built in the sibling repo; optional at run time.
def villageLaw = files('../minecraft-village-law/build/libs/villagelaw-1.1.0.jar')
// Vanilla Wheels 1.11.0: captives ride in the trailer through its cargo rules (its D-0029). Built in
// the sibling repo; optional at run time.
def vanillaWheels = files('../minecraft-vanilla-wheels/build/libs/vanillawheels-1.11.0.jar')
// Guard Villagers 2.4.11 (sha1 5168ed3f, the box's jar): its guards are Village Law's officers.
def guardVillagers = 'maven.modrinth:guard-villagers:b8N5GP8u'
// Lucky's Wardrobe 2.0.0 (sha1 a0a37d72, the box's jar): the pack's clothes, every one an armour item
// drawn by its own model (D-0004).
def luckysWardrobe = 'maven.modrinth:luckyowls-wardrobe:nkAh4uc7'
// Curios 9.5.1 (sha1 418fcd42, the box's jar): Lucky's Wardrobe's client code needs it to load. The
// booth's alone, from its own mods folder: on the GameTest server it sends its payloads to the mock
// players, which have no channel for them.
def curios = 'maven.modrinth:curios:yohfFbgD'
// `-PboothLook=fresh`: the booth sees villagers as the pack's players do (D-0011): Entity Model Features
// 3.2.4 and Entity Texture Features 7.1 (the pack's jars) in its mods folder, and the pack's Fresh
// Animations 1.10.4 on. Without it the booth is vanilla's look, which its checks were written for.
def freshLook = project.findProperty('boothLook') == 'fresh'
def freshPacks = [['FreshAnimations_v1.10.4.zip', 'https://cdn.modrinth.com/data/50dA9Sha/versions/xN57JJts/FreshAnimations_v1.10.4.zip',
                   '73db740a6868e043c5e615c036fca2c912615b6e']]
sourceSets { domain; gametest }
def verificationDirectories = [file('run/config'), file('run/booth/config')]
def boothDirectory = file('run/booth')
def gameTestLog = file('run/logs/latest.log')
def boothLog = file('run/booth/logs/latest.log')
var resetWorld = tasks.register('resetGameTestWorld', Delete) { delete 'run/world' }
var verification = tasks.register('prepareVerification') {
    doLast {
        new File('run/server.properties').with { if (!exists()) text = 'max-tick-time=0\n' }
        verificationDirectories.each { config ->
            config.mkdirs()
            new File(config, 'fml.toml').text = 'disableConfigWatcher=true\nearlyWindowControl=false\n'
        }
    }
}
var structures = tasks.register('copyGameTestStructures', Copy) {
    from 'devtools/gameteststructures'
    into 'run/gameteststructures'
}
configurations { boothMods { transitive = false } }
var boothModFolder = tasks.register('prepareBoothMods', Sync) {
    from configurations.boothMods
    into 'run/booth/mods'
}
def boothShots = file('run/booth/screenshots')
var boothWorld = tasks.register('prepareBoothWorld', Sync) {
    // The booth plays a copy of the GameTest world, silent, and saves into the copy.
    outputs.upToDateWhen { false }
    doFirst { boothShots.deleteDir() }
    from 'run/world'
    into 'run/booth/saves/booth'
    exclude 'session.lock'
    doLast {
        def directory = boothDirectory
        directory.mkdirs()
        new File(directory, 'options.txt').text = 'onboardAccessibility:false\nnarrator:0\nsoundCategory_master:0.0\npauseOnLostFocus:false\nrenderDistance:4\nsimulationDistance:5\nmaxFps:60\nguiScale:2\ntutorialStep:none\n' +
                (freshLook ? 'resourcePacks:["vanilla",' + freshPacks.collect { '"file/' + it[0] + '"' }.join(',') + ']\n' : '')
    }
}
def boothPackDirectory = file('run/booth/resourcepacks')
var boothPacks = tasks.register('prepareBoothPacks') {
    onlyIf { freshLook }
    doLast {
        def dir = boothPackDirectory
        dir.mkdirs()
        freshPacks.each { name, url, sha1 ->
            def pack = new File(dir, name)
            if (!pack.exists() || pack.bytes.digest('SHA-1') != sha1) new URL(url).withInputStream { input -> pack.withOutputStream { it << input } }
            if (pack.bytes.digest('SHA-1') != sha1) throw new GradleException(name + ': sha1 ' + pack.bytes.digest('SHA-1') + ', not ' + sha1)
        }
    }
}
neoForge {
    version = '21.1.248'
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'serfdom'
            systemProperty 'serfdom.trace', 'true'
            taskBefore structures
            taskBefore resetWorld
            taskBefore verification
        }
        photoBooth {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/booth')
            systemProperty 'serfdom.booth', 'true'
            // `-PboothScene=farm` runs the farm scene alone (D-0008), `-PboothScene=arms` the arms (D-0011),
            // `-PboothTrace` logs every worker's plan, `-PboothLook=fresh` sees villagers as the pack does.
            systemProperty 'serfdom.booth.scene', String.valueOf(project.findProperty('boothScene') ?: '')
            systemProperty 'serfdom.trace', String.valueOf(project.hasProperty('boothTrace'))
            programArguments.addAll('--quickPlaySingleplayer', 'booth', '--width', '1280', '--height', '720')
            taskBefore boothWorld
            taskBefore boothModFolder
            taskBefore boothPacks
            taskBefore verification
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        serfdom { sourceSet(sourceSets.domain); sourceSet(sourceSets.main) }
        serfdom_gametest { sourceSet(sourceSets.gametest) }
    }
    addModdingDependenciesTo(sourceSets.gametest)
}
neoForge.runs.matching { !(it.name in ['gameTestServer', 'photoBooth']) }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != 'serfdom_gametest' }
}
// The gametest run's classpath gets main's dependencies (Carried among them) as well as its classes.
configurations { gametestImplementation.extendsFrom implementation }
dependencies {
    // Carried: the hire fee is counted and taken from everything the player carries, their bags
    // included. Nested, as every consumer nests it; `./gradlew publishToMavenLocal` in
    // minecraft-carried first.
    jarJar(implementation('com.chunkworks.carried:carried')) {
        version {
            strictly '[1.0,2.0)'
            prefer '1.0.0'
        }
    }
    implementation sourceSets.domain.output
    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
    // Compile only: Village Deed is the pack's; the gametest server runs it, as the pack does.
    compileOnly villageDeed
    gametestCompileOnly villageDeed
    gametestRuntimeOnly villageDeed
    compileOnly thief
    gametestCompileOnly thief
    gametestRuntimeOnly thief
    // Compile only: Village Law and Vanilla Wheels are the pack's; the gametest server runs them, with
    // the officers' guards and the trailer whose cargo the captives ride in.
    compileOnly villageLaw
    gametestCompileOnly villageLaw
    gametestRuntimeOnly villageLaw
    compileOnly vanillaWheels
    gametestCompileOnly vanillaWheels
    gametestRuntimeOnly vanillaWheels
    gametestCompileOnly guardVillagers
    gametestRuntimeOnly guardVillagers
    gametestRuntimeOnly files('../minecraft-trailer/build/libs/trailer-2.4.0.jar')
    compileOnly farmersDelight
    gametestCompileOnly farmersDelight
    // The Ranged Weapons protocol 1.7: a worker fires any gun mod's guns through it in a raid (D-0007).
    // Compile only, never nested: Ranged Weapons Mod nests it, and without a gun mod there are no guns.
    // `./gradlew publishToMavenLocal` in minecraft-ranged-weapons first.
    compileOnly 'com.nfx.rangedweapons:rangedweapons:1.7.0'
    gametestCompileOnly 'com.nfx.rangedweapons:rangedweapons:1.7.0'
    gametestRuntimeOnly farmersDelight
    // Backpacks+ on the gametest server only, so a fee is proven paid out of a real bag; never bundled.
    gametestRuntimeOnly files('../minecraft-backpacks-plus/build/libs/backpacksplus-0.7.1.jar')
    // Ranged Weapons Mod 2.12.0 and Metals and Materials 1.0.3 (its steel) on the gametest server
    // only, so a blacksmith is proven to make a rifle at the weapons workbench (D-0002); never bundled.
    gametestRuntimeOnly files('../minecraft-ranged-weapons-mod/build/libs/rangedweaponsmod-2.12.0.jar')
    gametestRuntimeOnly files('../minecraft-metals-and-materials/build/libs/metalsandmaterials-1.0.3.jar')
    // Lucky's Wardrobe on the gametest server and in the booth only, so its clothes are proven to go
    // in a worker's slots, never wear, and fit as armour does (D-0004); never bundled.
    gametestRuntimeOnly luckysWardrobe
    boothMods curios
    if (freshLook) {
        boothMods 'maven.modrinth:4I1XuqiY:PAYgk63v'
        boothMods 'maven.modrinth:BVzZfTc1:YEMROAHv'
    }
}
tasks.named('test', Test) { useJUnitPlatform() }
jar { from sourceSets.domain.output }
def releaseVersion = version.toString()
tasks.named('processResources') {
    inputs.property 'version', releaseVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: releaseVersion }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('runGameTestServer') { task ->
    doLast {
        def log = gameTestLog.text
        def passed = log =~ /All (\d+) required tests passed/
        if (!passed.find() || log.contains('Mod loading has failed')) throw new GradleException('GameTests failed; see run/logs/latest.log')
        task.logger.lifecycle('GameTests: ' + passed.group(1) + ' passed')
    }
}
tasks.named('runPhotoBooth') {
    mustRunAfter 'runGameTestServer'
    doLast {
        def log = boothLog.text
        if (!log.contains('serfdom booth: COMPLETE') || log.contains('serfdom booth: FAIL')) throw new GradleException('Serfdom booth failed; see run/booth/logs/latest.log')
    }
}
tasks.named('prepareBoothWorld') { mustRunAfter 'runGameTestServer' }
tasks.named('check') {
    if (!project.hasProperty('skipGameTests')) dependsOn 'runGameTestServer'
    if (!project.hasProperty('skipBooth')) dependsOn 'runPhotoBooth'
}
